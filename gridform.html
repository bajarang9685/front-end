<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>vertical basic form</h2>
        <form action="" method="">
            <div class="row ">
             <div class="col-sm-4 p-3">
               <div class="form-group">

                <label>Email</label>
                <input type="email" class="form-control" id="email" placeholder="enter your email id">
             </div>            
            </div>
            
            <div class="col-sm-4 p-3">
                <div class="form-group">
                    <label>password</label>
                    <input type="password" class="form-control" id="pwd" placeholder="enter your password" name="email">
                </div>
            </div>
            </div>
            <div class="row">
                <div class="col-sm-4 p-3">
                    <div class="form-group">
                        <label>phone no</label>
                        <input type="tel" class="form-control" id="phone" placeholder="enter your phone number" name="phone">

                    </div>
                </div>
            </div>
            
            <div class="checkbox">
                <label><input type="checkbox" name="remember">Remember Me</label>

            </div>
            <button type="submit" class="btn btn-success">submit</button> 
            
            

            
        </form>
    </div>
    
</body>
</html>
